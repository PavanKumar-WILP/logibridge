---
- name: Deploy LogiBridge Edge Inference
  hosts: localhost
  connection: local
  become: yes
  gather_facts: false

  vars:
    app_dir: /opt/logibridge
    image_name: logiedge-inference:v1
    container_name: logiedge-inference

  tasks:

    #################################################################
    # Task 1
    #################################################################
    - name: Create application directory
      ansible.builtin.file:
        path: "{{ app_dir }}"
        state: directory
        mode: "0755"

    #################################################################
    # Task 2
    #################################################################
    - name: Copy model
      ansible.builtin.copy:
        src: ../inference/model.tflite
        dest: "{{ app_dir }}/model.tflite"
        mode: "0644"
      register: model_copy

    #################################################################
    # Task 3
    #################################################################
    - name: Copy reference distribution
      ansible.builtin.copy:
        src: ../monitoring/reference_dist.json
        dest: "{{ app_dir }}/reference_dist.json"
        mode: "0644"
      register: ref_copy

    #################################################################
    # Task 4
    #################################################################
    - name: Stop running inference container if deployment changed
      community.docker.docker_container:
        name: "{{ container_name }}"
        image: "{{ image_name }}"
        state: stopped
      when:
        - model_copy.changed or ref_copy.changed
      ignore_errors: yes

    #################################################################
    # Task 5
    #################################################################
    - name: Pull updated container image
      community.docker.docker_image:
        name: "{{ image_name }}"
        source: local

    #################################################################
    # Task 6
    #################################################################
    - name: Start inference container with environment variables
      community.docker.docker_container:
        name: "{{ container_name }}"
        image: "{{ image_name }}"
        state: started
        recreate: false
        restart_policy: unless-stopped
        container_default_behavior: compatibility

        env:
          MQTT_BROKER: host.docker.internal
          MQTT_PORT: "1883"
          TRUCK_ID: "TRUCK01"
          MODEL_PATH: "/app/inference/model.tflite"

        volumes:
          - "{{ app_dir }}/model.tflite:/app/inference/model.tflite:ro"
          - "{{ app_dir }}/reference_dist.json:/app/monitoring/reference_dist.json:ro"

    #################################################################
    # Task 7
    #################################################################
    - name: Wait 15 seconds and verify container is running
      ansible.builtin.shell: |
        sleep 15
        docker inspect "{{ container_name }}" --format '{% raw %}{{.State.Status}}{% endraw %}' | grep -q '^running$'
      args:
        executable: /bin/bash
      changed_when: false

